name: Build and Push Docker Images

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///:memory:
        run: |
          PYTHONPATH=. pytest backend/tests/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: core
            dockerfile: services/core/Dockerfile
            image-name: attendance-core
          - name: face-rec
            dockerfile: services/face-rec/Dockerfile
            image-name: attendance-face-rec
          - name: analytics
            dockerfile: services/analytics/Dockerfile
            image-name: attendance-analytics
          - name: alerts
            dockerfile: services/notifications/Dockerfile
            image-name: attendance-alerts
          - name: gateway
            dockerfile: services/frontend/Dockerfile
            image-name: attendance-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase registry path
        run: |
          echo "IMAGE_REPOSITORY=ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image-name }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:latest
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
